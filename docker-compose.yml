version: "3.9"

services:
  agent-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-utility-framework:latest
    container_name: agent-utility-framework
    ports:
      - "8501:8501"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    restart: unless-stopped
