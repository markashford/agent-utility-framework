[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-utility-framework"
version = "0.1.0"
description = "Educational agent framework using Anthropic tools and MCP integrations"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Mark Ashford", email = "markashford91@gmail.com" }
]
dependencies = [
  "anthropic>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]
ui = [
  "streamlit>=1.34.0",
]
mcp = [
  "mcp>=1.0.0",
]

[tool.setuptools]
packages = ["agents", "agents.tools", "agents.utils"]

[tool.setuptools.package-dir]
agents = "."

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
